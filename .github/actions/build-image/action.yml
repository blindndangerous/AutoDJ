name: Build and check the container image
description: >-
  Builds the image with buildx and a GitHub Actions layer cache, loads it into
  Docker, runs the Compose smoke test, writes a CycloneDX SBOM and fails on a
  fixable HIGH or CRITICAL finding. A publishing job then pushes the same build.
inputs:
  image:
    description: The local tag of the built image.
    default: autodj:ci
  channel:
    description: >-
      The update channel the image reports, stable or development; empty for an
      image that is not published.
    default: ""
  labels:
    description: Image labels, one per line, as docker/metadata-action writes them.
    default: ""
  sbom-artifact:
    description: The name of the uploaded SBOM artifact.
    default: container-sbom
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Containerfile
        platforms: linux/amd64
        pull: true
        load: true
        tags: ${{ inputs.image }}
        labels: ${{ inputs.labels }}
        build-args: |
          AUTODJ_COMMIT=${{ github.sha }}
          AUTODJ_IMAGE_CHANNEL=${{ inputs.channel }}
        provenance: false
        sbom: false
        cache-from: type=gha,scope=autodj-image
        cache-to: type=gha,mode=max,scope=autodj-image
    - name: Smoke-test unprivileged image
      shell: bash
      env:
        AUTODJ_SMOKE_IMAGE: ${{ inputs.image }}
      run: bash scripts/container_smoke.sh
    - name: Generate image SBOM
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        image: ${{ inputs.image }}
        format: cyclonedx-json
        output-file: container-sbom.cdx.json
    - name: Scan built image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        timeout: 15m0s
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: ${{ inputs.sbom-artifact }}
        path: container-sbom.cdx.json
