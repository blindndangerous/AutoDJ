name: Fuzz

on:
  schedule:
    - cron: '0 4 * * *'   # Every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hypothesis-fuzz:
    name: Hypothesis fuzz suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run fuzz suite
        # Override pyproject addopts with -o so coverage gates (which target
        # the unit-test pass) don't fire on the fuzz-only invocation.
        run: uv run pytest tests/fuzz/ --tb=short -q -o addopts=
