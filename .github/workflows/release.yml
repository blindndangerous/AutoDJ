name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write  # the test jobs upload coverage to Codecov through OIDC
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-and-verify:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15"}
      - name: Export build constraints
        run: >-
          uv export --frozen --only-group build --no-emit-project
          --format requirements-txt
          --output-file "$RUNNER_TEMP/build-constraints.txt"
      - name: Build distributions
        run: >-
          uv build --sdist --wheel
          --build-constraints "$RUNNER_TEMP/build-constraints.txt"
          --require-hashes
      - name: Verify tag, project version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uv version --short)" = "$version"
          grep -q "^## \[$version\]" CHANGELOG.md
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Smoke-install exact wheel
        run: |
          uv venv .release-venv --python 3.14
          uv pip install --python .release-venv/bin/python dist/*.whl
          test "$(.release-venv/bin/python -c 'import autodj; print(autodj.__version__)')" = "${GITHUB_REF_NAME#v}"
          .release-venv/bin/python -c 'import autodj, pathlib; static = pathlib.Path(autodj.__file__).parent / "static"; missing = [name for name in ("index.html", "app.js") if not (static / name).is_file()]; assert not missing, f"wheel lacks static/{missing}"'
      - name: Verify runtime API version
        run: |
          set -euo pipefail
          server_pid=""
          server_log="$RUNNER_TEMP/release-server.log"
          cleanup() {
            exit_code=$?
            trap - EXIT
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              for _shutdown_attempt in $(seq 1 10); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if (( exit_code != 0 )); then
              cat "$server_log" || true
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          mkdir -p "$RUNNER_TEMP/music" "$RUNNER_TEMP/index" "$RUNNER_TEMP/models"
          AUTODJ_INDEX_DIR="$RUNNER_TEMP/index" AUTODJ_MODEL_DIR="$RUNNER_TEMP/models" \
            .release-venv/bin/autodj serve >"$server_log" 2>&1 &
          server_pid=$!
          response=""
          ready=false
          for _attempt in $(seq 1 30); do
            if response="$(curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8080/api/version)"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "release server exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "release server did not become ready" >&2
            exit 1
          fi
          test "$(jq -r .version <<<"$response")" = "${GITHUB_REF_NAME#v}"
      # Scan the checkout, not dist/. Pointed at dist/ Syft sees two opaque
      # archives, finds no package manifests, and emits an SBOM with zero
      # components. The checkout carries pyproject.toml and uv.lock.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/

  # Publishes ghcr.io/<owner>/autodj:X.Y.Z, :stable and :latest once the tag,
  # version and changelog are verified.
  image:
    needs: build-and-verify
    uses: ./.github/workflows/image.yml
    with:
      release: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # The opt-in CUDA image, :X.Y.Z-cuda and :stable-cuda, beside the CPU image.
  # Nothing waits for it: when it fails, the CPU image and the GitHub release
  # are still published, the run is marked failed, and :stable-cuda stays on
  # the previous release until the maintainer reruns the failed jobs. A rerun
  # never replaces an :X.Y.Z-cuda already pushed; it points :stable-cuda at it,
  # and only while this is still the highest release tag in git, so rerunning
  # an older release never moves :stable or :stable-cuda back. The same rule
  # means a newer tag pushed while this release runs, or a stray release-style
  # tag, holds :stable and :stable-cuda back: rerun the image jobs once that
  # tag is released or deleted.
  image-cuda:
    needs: build-and-verify
    uses: ./.github/workflows/image.yml
    with:
      release: true
      variant: cuda
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # The GitHub release, which the update check reads as the latest release,
  # appears only once the CPU image it points to is published.
  publish:
    needs: [build-and-verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-artifacts, path: dist}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact artifacts
        run: |
          for file in dist/*; do cosign sign-blob --yes --bundle "${file}.bundle" "$file"; done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"
          # The changelog section first, then GitHub's list of merged pull requests.
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes dist/*
