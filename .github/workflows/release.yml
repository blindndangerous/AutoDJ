name: Release
on:
  push:
    tags: ["v*"]
# Reusable workflows can only maintain or reduce permissions down the chain, never
# elevate them, so the ceiling here must already include every scope a called
# workflow needs. `ci.yml` requests id-token: write for its Codecov OIDC upload.
# Each job below still narrows to its own minimal set.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-and-verify:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: "3.14"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: {node-version: "24.6.0", cache: "npm"}
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend assets
        run: npm run build
      - name: Export build constraints
        run: >-
          uv export --frozen --only-group build --no-emit-project
          --format requirements-txt
          --output-file "$RUNNER_TEMP/build-constraints.txt"
      - name: Build distributions
        run: >-
          uv build --sdist --wheel
          --build-constraints "$RUNNER_TEMP/build-constraints.txt"
          --require-hashes
      - name: Verify tag, project version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uv version --short)" = "$version"
          grep -q "^## \[$version\]" CHANGELOG.md
      - name: Smoke-install exact wheel
        run: |
          uv venv .release-venv --python 3.14
          uv pip install --python .release-venv/bin/python dist/*.whl
          test "$(.release-venv/bin/python -c 'import autodj; print(autodj.__version__)')" = "${GITHUB_REF_NAME#v}"
          .release-venv/bin/python -c 'import autodj, pathlib; assert (pathlib.Path(autodj.__file__).parent / "static_dist" / "app.js").is_file(), "wheel lacks the built web bundle"'
      - name: Verify runtime API version
        run: |
          set -euo pipefail
          server_pid=""
          server_log="$RUNNER_TEMP/release-server.log"
          cleanup() {
            exit_code=$?
            trap - EXIT
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              for _shutdown_attempt in $(seq 1 10); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if (( exit_code != 0 )); then
              cat "$server_log" || true
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          mkdir -p "$RUNNER_TEMP/music" "$RUNNER_TEMP/index" "$RUNNER_TEMP/models"
          AUTODJ_LIBRARY_MUSIC_DIR="$RUNNER_TEMP/music" AUTODJ_INDEX_DIR="$RUNNER_TEMP/index" AUTODJ_MODEL_DIR="$RUNNER_TEMP/models" \
            .release-venv/bin/autodj serve >"$server_log" 2>&1 &
          server_pid=$!
          response=""
          ready=false
          for _attempt in $(seq 1 30); do
            if response="$(curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8080/api/version)"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "release server exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "release server did not become ready" >&2
            exit 1
          fi
          test "$(jq -r .version <<<"$response")" = "${GITHUB_REF_NAME#v}"
      # Scan the checkout, not dist/. Pointed at dist/ Syft sees two opaque
      # archives, finds no package manifests, and emits an SBOM with zero
      # components. The checkout carries pyproject.toml and uv.lock.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-artifacts, path: dist}
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Sign exact artifacts
        run: |
          for file in dist/*; do cosign sign-blob --yes --bundle "${file}.bundle" "$file"; done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
