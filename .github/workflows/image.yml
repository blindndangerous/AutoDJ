name: Container image

# Publishes ghcr.io/<owner>/autodj. A push to master publishes :development
# and :sha-<short commit>; release.yml calls this for a vX.Y.Z tag, after its
# checks, to publish :X.Y.Z, :stable and :latest. Each run builds the image,
# smoke-tests and scans it as CI does, then pushes that same build and attests
# its provenance. Pull requests never get here: CI builds and checks only.
on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release:
        description: Publish a release tag's image instead of master's.
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  # One publish per ref at a time, in push order, so :development ends on the
  # newest commit.
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Name the image
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: printf 'image=ghcr.io/%s/autodj\n' "${OWNER,,}" >>"$GITHUB_OUTPUT"
      - name: Choose tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=development,enable=${{ !inputs.release }}
            type=sha,prefix=sha-,format=short,enable=${{ !inputs.release }}
            type=semver,pattern={{version}},enable=${{ inputs.release == true }}
            type=raw,value=stable,enable=${{ inputs.release == true }}
            type=raw,value=latest,enable=${{ inputs.release == true }}
      - name: Build and check the image
        uses: ./.github/actions/build-image
        with:
          channel: ${{ inputs.release && 'stable' || 'development' }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom-artifact: image-sbom
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same inputs as the checked build, so every layer comes from the
      # builder's cache and the pushed image is the one that was tested.
      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTODJ_COMMIT=${{ github.sha }}
            AUTODJ_IMAGE_CHANNEL=${{ inputs.release && 'stable' || 'development' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=autodj-image
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
