name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container build, smoke, and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build and smoke-test unprivileged image
        run: bash scripts/container_smoke.sh
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: autodj:local
          format: cyclonedx-json
          output-file: container-sbom.cdx.json
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autodj:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m0s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-sbom
          path: container-sbom.cdx.json

  frontend:
    name: Frontend lint, test, build, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.6.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run deadcode
      - run: npm audit --audit-level=high

  quality:
    name: Quality & security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff — lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Coverage exclusion policy
        run: uv run python scripts/check_coverage_policy.py

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Mypy — type check
        run: uv run mypy src/autodj/

      - name: Vulture — dead code
        run: uv run vulture

      - name: Deptry — unused / missing deps
        run: uv run deptry src/

      - name: Bandit — security scan
        run: uv run bandit -r src/ -c pyproject.toml

      - name: pip-audit — dependency CVE scan
        run: uv run pip-audit

      - name: Semgrep — multi-rule SAST
        continue-on-error: true     # advisory; bandit is the hard gate
        run: uvx semgrep --error --config p/python --config p/owasp-top-ten src/

      - name: pip-licenses — license inventory
        run: uv run pip-licenses --format=markdown --order=license

      # AGPL is the class that would actually change AutoDJ's obligations as a
      # network service. The known copyleft dependencies are disclosed in README:
      # mutagen (GPL-2.0-or-later) and soxr (LGPL, via librosa) are in the base
      # install. This gate exists to catch a new AGPL dependency arriving unnoticed.
      - name: pip-licenses — reject AGPL dependencies
        run: >-
          uv run pip-licenses
          --fail-on="GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later"

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Pytest — test suite
        run: uv run python scripts/ci_pytest.py

  browser:
    name: Browser assertions (Chromium, Firefox)
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.6.0"
          cache: npm
      - run: uv sync --frozen --all-extras
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Start empty-library server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/music" "$RUNNER_TEMP/index" "$RUNNER_TEMP/models"
          AUTODJ_LIBRARY_MUSIC_DIR="$RUNNER_TEMP/music" \
          AUTODJ_INDEX_DIR="$RUNNER_TEMP/index" \
          AUTODJ_MODEL_DIR="$RUNNER_TEMP/models" \
          uv run autodj serve >"$RUNNER_TEMP/autodj.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$RUNNER_TEMP/autodj.pid"
          for _attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 \
              http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/autodj.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autodj.log"
          exit 1
      - name: Run Chromium and Firefox assertions
        run: npm run audit:ci
        env:
          AUTODJ_BROWSERS: chromium,firefox
          AUTODJ_URL: http://127.0.0.1:8080
      - name: Stop empty-library server
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/autodj.pid"; then
            server_pid=$(cat "$RUNNER_TEMP/autodj.pid")
            kill "$server_pid" 2>/dev/null || true
            for _attempt in $(seq 1 10); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-audit-reports
          path: |
            *_audit*.json
            ${{ runner.temp }}/autodj.log
