name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Drafts run these checks; ready PRs and non-PR events run every job.
  # Full CI on the final revision is required before merge.
  fast:
    name: Static checks and no-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run --frozen --no-sync python scripts/check_architecture_docs.py
      - run: uv run --frozen --no-sync ruff check src/ tests/ scripts/
      - run: uv run --frozen --no-sync ruff format --check src/ tests/ scripts/
      - run: uv run --frozen --no-sync python scripts/check_coverage_policy.py
      - name: Pytest — no-model environment
        run: uv run --frozen --no-sync python scripts/ci_pytest.py --profile no-model
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.12.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  container:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Container build, smoke, and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Builds, smoke-tests and scans only; image.yml publishes from master and
    # release.yml from a release tag, after the same checks.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The smoke test runs the image through compose.yaml alone; check that the
      # local-build override still resolves with it.
      - name: Check the local-build Compose files
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.build.yaml config -q
          test "$(docker compose -f compose.yaml -f compose.build.yaml config --images)" = autodj:local
      - uses: ./.github/actions/build-image

  frontend:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Frontend lint, test, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.12.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=5120
      - run: npm run deadcode
      - run: npm audit --audit-level=high

  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Quality & security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Mypy — type check
        run: uv run --frozen --no-sync mypy src/autodj/

      - name: Vulture — dead code
        run: uv run --frozen --no-sync vulture

      - name: Deptry — unused / missing deps
        run: uv run --frozen --no-sync deptry src/

      - name: Bandit — security scan
        run: uv run --frozen --no-sync bandit -r src/ -c pyproject.toml

      - name: pip-audit — dependency CVE scan
        run: uv run --frozen --no-sync pip-audit

      - name: Semgrep — multi-rule SAST
        continue-on-error: true     # advisory; bandit is the hard gate
        run: uvx semgrep --error --config p/python --config p/owasp-top-ten src/

      - name: pip-licenses — license inventory
        run: uv run --frozen --no-sync pip-licenses --format=markdown --order=license

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # From GitHub's cache after the first run, so a slow Ubuntu mirror cannot
      # use up the job's time.
      - name: Install FFmpeg (Linux, cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        timeout-minutes: 15
        with:
          packages: ffmpeg
          version: v1
          execute_install_scripts: true

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Pytest — test suite
        run: uv run --frozen --no-sync python scripts/ci_pytest.py --profile full --require-executed tests/unit/test_review_render.py --durations=30
        env:
          AUTODJ_PYTEST_WORKERS: "2"

  browser:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Browser assertions (Chromium, Firefox)
    # Start after the frontend suite without waiting for the Python suites.
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.12.0"
          cache: npm
      - run: uv sync --frozen --all-extras
      - run: npm ci --ignore-scripts
      # Playwright's missing system packages come from GitHub's cache after the
      # first run, so a slow Ubuntu mirror cannot use up the job's time.
      - name: List missing browser packages
        id: browser-packages
        shell: bash
        run: |
          set -uo pipefail
          report=$(npx --no-install playwright install-deps --dry-run chromium firefox 2>&1) || true
          packages=$(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | tr '\n' ' ')
          printf 'packages=%s\n' "$packages" >>"$GITHUB_OUTPUT"
      - name: Install browser packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        timeout-minutes: 15
        with:
          packages: ${{ steps.browser-packages.outputs.packages }}
          version: v1
          execute_install_scripts: true
          empty_packages_behavior: ignore
      - run: npx --no-install playwright install chromium firefox
      - name: Check rendered documentation
        shell: bash
        env:
          AUTODJ_BROWSERS: chromium,firefox
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python scripts/render_documentation.py \
            --output "$RUNNER_TEMP/documentation-render" --write
          node tests/playwright/documentation_audit.mjs \
            "$RUNNER_TEMP/documentation-render" --write
      - name: Start empty-library server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/music" "$RUNNER_TEMP/index" "$RUNNER_TEMP/models"
          # The public player pages and the listener request page are off by
          # default; turn them on so the visual audit covers them and the
          # operator's request card.
          printf '[player_page]\nenabled = true\nembed = true\n\n[requests]\nenabled = true\n' \
            >"$RUNNER_TEMP/config.toml"
          AUTODJ_INDEX_DIR="$RUNNER_TEMP/index" \
          AUTODJ_MODEL_DIR="$RUNNER_TEMP/models" \
          uv run --frozen --no-sync autodj --config "$RUNNER_TEMP/config.toml" serve >"$RUNNER_TEMP/autodj.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$RUNNER_TEMP/autodj.pid"
          for _attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 \
              http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/autodj.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autodj.log"
          exit 1
      - name: Run Chromium and Firefox assertions
        run: npm run audit:ci
        env:
          AUTODJ_BROWSERS: chromium,firefox
          AUTODJ_URL: http://127.0.0.1:8080
      - name: Stop empty-library server
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/autodj.pid"
          if test -f "$pid_file"; then
            server_pid=$(cat "$pid_file")
            kill "$server_pid" 2>/dev/null || true
            for _attempt in $(seq 1 10); do
              kill -0 "$server_pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-audit-reports
          path: |
            *_audit*.json
            ${{ runner.temp }}/autodj.log
            ${{ runner.temp }}/documentation-render/manifest.json
            ${{ runner.temp }}/documentation-render/report.json

  browser-stream:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Browser assertions (stream, Chromium)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.12.0"
          cache: npm
      - run: uv sync --frozen --all-extras
      - run: npm ci --ignore-scripts
      # Playwright's missing system packages and ffmpeg come from GitHub's cache
      # after the first run, so a slow Ubuntu mirror cannot use up the job's time.
      - name: List missing browser packages
        id: browser-packages
        shell: bash
        run: |
          set -uo pipefail
          report=$(npx --no-install playwright install-deps --dry-run chromium 2>&1) || true
          packages=$(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | tr '\n' ' ')
          printf 'packages=%s\n' "${packages}ffmpeg" >>"$GITHUB_OUTPUT"
      - name: Install browser packages and ffmpeg (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        timeout-minutes: 15
        with:
          packages: ${{ steps.browser-packages.outputs.packages }}
          version: v1
          execute_install_scripts: true
      - run: npx --no-install playwright install chromium
      - name: Start stream-mode server
        shell: bash
        run: |
          set -euo pipefail
          # Stream mode encodes with ffmpeg (installed above) and refuses to start without it.
          mkdir -p "$RUNNER_TEMP/stream/music" "$RUNNER_TEMP/stream/index" "$RUNNER_TEMP/stream/models"
          printf '[server]\nport = 8081\n' >"$RUNNER_TEMP/stream/config.toml"
          AUTODJ_LIBRARY_MUSIC_DIR="$RUNNER_TEMP/stream/music" \
          AUTODJ_INDEX_DIR="$RUNNER_TEMP/stream/index" \
          AUTODJ_MODEL_DIR="$RUNNER_TEMP/stream/models" \
          uv run --frozen --no-sync autodj --config "$RUNNER_TEMP/stream/config.toml" serve --stream \
            >"$RUNNER_TEMP/autodj-stream.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$RUNNER_TEMP/autodj-stream.pid"
          for _attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 \
              http://127.0.0.1:8081/healthz; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/autodj-stream.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autodj-stream.log"
          exit 1
      - name: Run Chromium visual audit in stream mode
        run: npm run audit:visual
        env:
          AUTODJ_BROWSERS: chromium
          AUTODJ_URL: http://127.0.0.1:8081
      - name: Stop stream-mode server
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/autodj-stream.pid"
          if test -f "$pid_file"; then
            server_pid=$(cat "$pid_file")
            kill "$server_pid" 2>/dev/null || true
            for _attempt in $(seq 1 10); do
              kill -0 "$server_pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-stream-audit-reports
          path: |
            *_audit*.json
            ${{ runner.temp }}/autodj-stream.log
