# AutoDJ in Docker runs in LAN mode: it listens on all interfaces (0.0.0.0)
# and every browser must pair before it can control playback. Bare-metal
# `autodj serve` stays local-only unless you pass --lan.
#
# Host networking lets LAN mode see this machine's own names and addresses,
# so browsers can use them without extra settings. Startup prints the
# addresses to open and a pairing code. The pairing secret is created on first
# start and saved in the index folder.
#
# Optional settings go in .env beside this file (see the README):
#   AUTODJ_MUSIC_DIR, AUTODJ_INDEX_DIR, AUTODJ_MODEL_DIR  host folders
#   AUTODJ_BEETS_PATH  host folder holding beets' library.db, mounted at /beets
#   AUTODJ_UID, AUTODJ_GID  the owner of those host folders
# Server and library settings come from config.toml and config.local.toml in
# this folder, as on bare metal.

services:
  autodj:
    build:
      context: .
      dockerfile: Containerfile
    image: autodj:local
    container_name: autodj
    restart: unless-stopped
    network_mode: host
    user: "${AUTODJ_UID:-10001}:${AUTODJ_GID:-10001}"
    # config.toml and config.local.toml are read from the working directory.
    working_dir: /config
    command: ["serve", "--lan"]
    environment:
      # Tells LAN mode the addresses it detects are the machine's own.
      AUTODJ_HOST_NETWORK: "1"
      # Writable for any AUTODJ_UID; the image's home belongs to uid 10001.
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ${AUTODJ_MUSIC_DIR:-./music}:/music:ro
      - ${AUTODJ_INDEX_DIR:-autodj-index}:/index
      - ${AUTODJ_MODEL_DIR:-autodj-models}:/models
      - ${AUTODJ_BEETS_PATH:-./container}:/beets:ro
      - ./:/config:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  autodj-index:
  autodj-models:
