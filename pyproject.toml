[project]
name = "autodj"
version = "0.21.0"
description = "AI-powered local music continuity player using MuQ embeddings and FAISS similarity search"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "blindndangerous" },
    { name = "jage9" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
# Core dependencies cover the browser UI, playback, streaming and basic library
# import without a music model. The index extra adds MuQ analysis; the native
# default setup and container retain it. Librosa supplies CPU audio features.
dependencies = [
    "faiss-cpu>=1.8.0", # nearest-neighbor vector search
    "numpy>=1.26.0", # vector math
    "click>=8.1.0", # CLI framework
    "rich>=13.0.0", # terminal UI (panels, tables)
    "python-multipart>=0.0.32", # form uploads; 0.0.32 limits part header count and size
    "librosa>=0.11.0", # spectral / chroma feature extraction
    "fastapi>=0.136.3", # web UI
    "starlette~=1.6.0", # imported by the security middleware; patch releases only
    "pydantic>=2.0.0", # request/response models in server.py
    "uvicorn[standard]>=0.47.0", # ASGI server; 0.47 adds ssl_context_factory
    "huggingface_hub>=1.31.0", # model checkpoint download
    "mutagen>=1.47.0", # tags, ReplayGain, cover art, embedded lyrics, ALAC detection
    "scipy>=1.13.0", # biquad filters (EQ duck, sweeps, transitions)
    "numba>=0.67.0", # compiled mix-bus kernels that keep the GIL (EQ, duck)
    "filelock>=3.32.5", # cross-process index manifest lock
    "tzdata>=2026.1", # IANA time zones on Windows
    "tzlocal>=5.3.1,<6", # detect the system IANA zone, including on Windows
]

[project.optional-dependencies]
# Extras only add what the core set does not already provide.
# `index` adds the music-model stack for local CPU/GPU analysis.
index = [
    "muq>=0.1.0",
    "transformers>=5.16.1",
    "torch>=2.2.0",              # MuQ inference (CPU or CUDA)
    "soundfile>=0.12.0",         # audio file decoding
]

# `play` adds server-side audio output for `serve --server-audio`.
play = [
    "soundfile>=0.12.0",         # decode FLAC / WAV
    "sounddevice>=0.4.6",        # cross-platform audio output
]

# Convenience meta-group: every extra above.
all = [
    "muq>=0.1.0", "transformers>=5.16.1",
    "torch>=2.2.0", "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
autodj = "autodj.launcher:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=autodj --cov-report=term-missing --basetemp=tmp --timeout=60"
asyncio_mode = "auto"
markers = ["dj_analysis: let library scans run the beat and cue analysis"]
filterwarnings = [
    "error:unclosed database.*:ResourceWarning",
    "error:Exception ignored while finalizing database connection.*:pytest.PytestUnraisableExceptionWarning",
    # Suppress DeprecationWarnings from FAISS SWIG bindings (third-party, not fixable)
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/autodj"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "if torch.cuda.is_available\\(\\):",
    "if not torch.cuda.is_available\\(\\):",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
# Keep formatter output parseable by mypy/vulture until they support
# Python 3.14's bare tuple exception handlers.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (unnecessary comprehension patterns)
    "SIM", # flake8-simplify (simplifiable expressions)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "SIM108", # ternary operator — sometimes less readable
    "B008",   # function calls in default args — FastAPI uses this pattern
    "UP034",  # Python 3.14 exception tuple syntax is not parsed by mypy/vulture yet
    "RUF001", # en-dash in strings — intentional display characters throughout
    "RUF002", # en-dash in docstrings — intentional (documenting accepted separators)
    "RUF003", # en-dash / × in comments — intentional (display labels, math notation)
]

[tool.ruff.lint.isort]
known-first-party = ["autodj"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["src/autodj"]
strict = false
ignore_missing_imports = true   # many deps lack stubs (torch, faiss, librosa…)
warn_unused_ignores = true
warn_return_any = false         # too noisy with untyped third-party libs
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# ---------------------------------------------------------------------------
# Bandit — security linter
# ---------------------------------------------------------------------------
[tool.deptry]
# Treat the package itself as a first-party import so DEP003 doesn't
# fire on every ``from autodj.x import y`` statement inside the source
# tree.  All third-party deps are pinned in [project.dependencies] +
# [project.optional-dependencies].
known_first_party = ["autodj"]
extend_exclude = ["tests", "tmp"]

[tool.deptry.per_rule_ignores]
# DEP002 -- declared but never imported by name.  python-multipart is
# a transitive runtime dep that FastAPI uses for form uploads.  pytest
# / pytest-cov / pytest-asyncio / hypothesis are test tools loaded by
# pytest itself, not imported in src/.  httpx2 is the starlette
# TestClient backend + direct ASGI client, used only in tests.  tzdata is
# the IANA time zone database that zoneinfo reads on Windows.
DEP002 = [
    "python-multipart",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "hypothesis",
    "httpx2",
    "tzdata",
]

[tool.vulture]
paths = ["src/autodj", "scripts", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = true
exclude = ["tests/", "tmp/"]
ignore_decorators = [
    "@app.*", "@router.*", "@station_router.*",  # FastAPI routes
    "@*.command",  # click commands
    "@field_validator", "@model_validator",  # pydantic hooks
    "@pytest.fixture",
]
# `set_playback_settings` collects all of its keyword params into a
# locals()-derived dict and dispatches via per-helper readers, so the
# raw parameter name is never referenced directly by vulture's heuristic.
# `model_config` is pydantic's class-level configuration hook.
ignore_names = ["model_config", "replaygain_enabled", "replaygain_target_db", "transition_fx", "transition_wet_mix"]

[tool.bandit]
targets = ["src/autodj"]
exclude_dirs = ["tests", "tmp"]
skips = [
    "B101",  # assert statements — fine in production code here (not a web endpoint)
    "B311",  # random.choice — used only for non-security purposes (picking a random song)
]

[dependency-groups]
build = [
    "hatchling==1.31.0",
]
dev = [
    "bandit>=1.9.4",
    "markdown-it-py>=4.0.0",  # documentation renderer
    "mypy>=2.0.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",  # async test support for FastAPI broadcast loop
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.0",  # default timeout so audio / playwright tests can't hang CI
    "hypothesis>=6.100.0",    # property-based tests for the LRC parser
    "httpx2>=2.0.0",          # starlette TestClient backend + direct ASGI client in server tests
    "ruff>=0.15.10",
    "vulture>=2.16",         # dead-code detector
    "deptry>=0.20",          # dep declaration auditor
    "pytest-xdist>=3.6.0",   # parallel test execution
    "pip-licenses>=5.0",     # license auditor
]
